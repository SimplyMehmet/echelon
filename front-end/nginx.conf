server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types application/json application/javascript text/css text/html;
  gzip_min_length 1024;

  # Every real route is prerendered to its own directory. Resolve straight to
  # the index file rather than letting nginx redirect /foo -> /foo/, which costs
  # a round trip on every link.
  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }

  # Unmatched URLs get the client shell, which boots and renders the app's own
  # not-found page — with a real 404 status, not a 200.
  error_page 404 /404.html;

  # Hashed filenames, so they can be cached forever. The JSON under /data is
  # deliberately excluded: it is not hashed and changes when the data is rescraped.
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /api/ {
    proxy_pass http://back-end:8080/api/;
    proxy_set_header Host $host;
  }
}
