<footer class="sketch-box mt-8">
  <div class="mx-auto flex max-w-5xl flex-col gap-2 p-4">
    @if (meta.value(); as m) {
      <p>
        {{ m.counts.players }} players · {{ m.counts.scoringEvents }} scoring weeklies ·
        {{ m.counts.seasons }} seasons
      </p>
      <p>
        Snapshot of <span>{{ m.source }}</span> taken
        <time [attr.datetime]="m.generatedAt">{{ m.generatedAt }}</time>
      </p>
    }
  </div>
</footer>
