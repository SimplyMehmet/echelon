<div
  class="flex flex-col fixed left-0 right-0 top-0 bottom-0 z-20 bg-black overflow-y-auto lg:overflow-visible"
>
  <div class="flex flex-col shrink-0 lg:flex-row lg:shrink lg:h-full">
    <div class="w-full lg:w-[60%]">
      <app-twitch-stream />
    </div>
    <div class="w-full lg:w-[40%]">
      <app-leaderboards-banner [fullscreen]="true" />
    </div>
  </div>
  <div class="flex flex-col shrink-0 sm:flex-row lg:shrink lg:h-full">
    <div
      class="w-full py-10 flex flex-col items-center justify-center text-center sm:w-[60%] lg:py-0"
    >
      <span class="text-5xl uppercase block sm:text-6xl">Get ready</span>
      <span class="text-3xl uppercase block sm:text-4xl">for the</span>
      <span class="text-5xl uppercase block sm:text-6xl">next battle</span>
    </div>
    <div class="w-full pb-10 flex items-center justify-center sm:w-[40%] sm:py-10 lg:py-0">
      <img class="h-32 sm:h-44 lg:h-full lg:py-20" src="/img/levels-logo.png" alt="Levels Gaming" />
    </div>
  </div>
</div>
