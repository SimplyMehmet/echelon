<div
  class="w-full flex flex-col fixed z-10 top-0 left-0 right-0 h-[77px] border-b header-bg border-white/50"
>
  <div class="max-w-7xl flex w-full m-auto h-[80%]">
    <div class="px-4 h-full">
      <img class="h-full" src="/img/levels-logo.png" />
    </div>

    <div class="ml-auto my-auto px-4">
      <a
        class="uppercase text-white opacity-50 px-4 py-2 text-[12px]"
        routerLink="/"
        routerLinkActive="border-b border-b-2 active-link opacity-100"
        [routerLinkActiveOptions]="{ exact: true }"
        >Home</a
      >
      <a
        class="uppercase text-white opacity-50 px-4 py-2 text-[12px]"
        routerLink="/events"
        routerLinkActive="border-b border-b-2 active-link opacity-100"
        >Events</a
      >
      <a
        class="uppercase text-white opacity-50 px-4 py-2 text-[12px]"
        routerLink="/leaderboards"
        routerLinkActive="border-b border-b-2 active-link opacity-100"
        >Leaderboards</a
      >
    </div>
  </div>
</div>
