<div class="flex flex-col gap-2">
  <label [attr.for]="label()">{{ label() }}</label>
  <input
    [id]="label()"
    [value]="query()"
    (input)="onQuery($event)"
    type="search"
    class="field p-2"
    placeholder="Search a gamertag"
  />
  <ul class="flex flex-col gap-1">
    @for (player of visible(); track player.id) {
      <li>
        <button type="button" class="btn w-full p-2" (click)="selected.emit(player.id)">
          {{ player.gamertag }}
          @if (player.origin === 'walk-in') {
            <span> · walk-in</span>
          }
        </button>
      </li>
    } @empty {
      <li>No players match.</li>
    }
  </ul>
</div>
